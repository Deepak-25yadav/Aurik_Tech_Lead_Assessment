services:
  monitoring-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurik_equipment_monitoring
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/equipment_monitoring.db
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  app_data:
    driver: local
